---
# defaults file for base
raspberry_pi: false

# Opt-in switch for a disruptive task. Left off so `./deploy.sh <inv> site.yml`
# is safe to run against the live cluster. Enable deliberately, per node, in a
# maintenance window.
base_full_upgrade: false      # `dnf upgrade "*"` + reboot-if-needed

# Stop & mask firewalld. On by default: every cluster node runs without it
# (Cilium owns packet filtering), and a fresh EL install leaves it active,
# rejecting kubelet (10250) and Cilium VXLAN/health traffic. A no-op on nodes
# where it is already masked.
base_manage_firewalld: true

# LVM global_filter applied by tasks/lvm-filter.yml. First match wins; the
# trailing accept keeps every non-Ceph device visible.
base_lvm_global_filter: '[ "r|^/dev/rbd.*|", "r|^/dev/nbd.*|", "a|.*|" ]'

# CPU clock cap in kHz (tasks/cpufreq.yml); 0 = leave the clock alone. Set per
# host in inventory/host_vars.
base_cpu_max_freq_khz: 0
