- name: Disable chronyd since it makes fedora system upgrade fail
  ansible.builtin.systemd_service:
    state: stopped
    enabled: false
    name: chronyd
  when: raspberry_pi == true and ansible_distribution in ['Fedora']

- name: Enable systemd-timesyncd instead of chronyd
  ansible.builtin.systemd_service:
    state: stopped
    enabled: false
    name: chronyd
  when: raspberry_pi == true and ansible_distribution in ['Fedora']
