all:
  vars:
    ansible_connection: ssh
  hosts:
    ceres.lan:
      ansible_host: 10.11.12.171
    deimos.lan:
      ansible_host: 10.11.12.48
    pallas.lan:
      ansible_host: 10.11.12.156
    nas.lan:
      ansible_host: 10.11.12.16
  children:
    kube_control_plane:
      hosts:
        # ceres.lan must stay first: Kubespray does not support changing the
        # first kube_control_plane entry. deimos/pallas appended for HA control
        # plane -- see docs/add-control-plane-node.md before running cluster.yml.
        ceres.lan:
        deimos.lan:
        pallas.lan:
    kube_node:
      hosts:
        ceres.lan:
        deimos.lan:
        pallas.lan:
        nas.lan:
    etcd:
      hosts:
        # 3 members for quorum. deimos/pallas are already kube_node members, so
        # each must be drained via remove-node.yml and re-added -- follow
        # docs/add-control-plane-node.md; do NOT just run cluster.yml.
        ceres.lan:
        deimos.lan:
        pallas.lan:
    k8s_cluster:
      children:
        kube_control_plane:
        kube_node:
    # Consumed by playbooks/site.yml (host configuration), not by Kubespray.
    nas:
      hosts:
        nas.lan:
