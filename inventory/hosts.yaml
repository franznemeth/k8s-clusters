all:
  vars:
    ansible_connection: ssh
  hosts:
    ceres.lan:
      ansible_host: 10.11.12.171
    deimos.lan:
      ansible_host: 10.11.12.48
    pallas.lan:
      ansible_host: 10.11.12.156
    nas.lan:
      ansible_host: 10.11.12.16
  children:
    kube_control_plane:
      hosts:
        # HA plan: ceres + deimos + pallas. deimos/pallas are added ONE AT A TIME
        # by docs/add-control-plane-node.md -- uncomment a node only on its pass.
        # ceres.lan must stay first (Kubespray cannot change the first entry).
        ceres.lan:
        #deimos.lan:
        #pallas.lan:
    kube_node:
      hosts:
        ceres.lan:
        deimos.lan:
        pallas.lan:
        nas.lan:
    etcd:
      hosts:
        # 3 members for quorum, added one at a time -- see
        # docs/add-control-plane-node.md. Uncomment in lockstep with
        # kube_control_plane above.
        ceres.lan:
        #deimos.lan:
        #pallas.lan:
    k8s_cluster:
      children:
        kube_control_plane:
        kube_node:
    # Consumed by playbooks/site.yml (host configuration), not by Kubespray.
    nas:
      hosts:
        nas.lan:
