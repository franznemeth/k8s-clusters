[defaults]
# Config for the repo-root host-configuration playbooks (playbooks/site.yml and
# the roles/ tree ported from ansible-lan). Kubespray runs are unaffected:
# deploy.sh cd's into kubespray/ first, so kubespray/ansible.cfg wins there.
roles_path = ./roles
inventory = ./inventory
# Don't treat the kubespray-generated kubeconfig / cred files as inventory.
inventory_ignore_extensions = ~, .orig, .bak, .ini, .cfg, .retry, .pyc, .pyo, .creds, .gpg, .conf
interpreter_python = auto
host_key_checking = False
host_pattern_mismatch = ignore
retry_files_enabled = False
nocows = True
deprecation_warnings = False
callbacks_enabled = profile_tasks
remote_user = franz.nemeth
private_key_file = ~/.ssh/id_ed25519

[privilege_escalation]
become = True

[ssh_connection]
pipelining = True
